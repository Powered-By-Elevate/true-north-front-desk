  :root {
    --ground: #f1f4f9;
    --ground2: #e6ebf3;
    --card: #ffffff;
    --ink: #15202d;
    --muted: #5d6b7d;
    --hairline: #dde3ec;
    --navy: #132644;
    --navy-2: #1c3559;
    --navy-ink: #cfd9e8;
    --tn-blue: #4B91BE;
    --gold: #b8943f;
    --chip: #f2f5fa;
    --chip-ink: #55637a;
    --soon: #7b8798;
    --shadow: 0 1px 2px rgba(19,38,68,.05), 0 4px 14px rgba(19,38,68,.055);
    --lift: 0 8px 18px rgba(19,38,68,.10), 0 26px 50px rgba(19,38,68,.13);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(180deg, var(--ground) 0%, var(--ground) 60%, var(--ground2) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 82rem; margin: 0 auto; padding: 0 20px 72px; }

  /* ── Masthead. Full-bleed True North navy: the page should feel like arriving
        somewhere, not like opening a bookmarks folder. The reverse lockup is the
        real brand asset (core-bi/assets/tn-logo-dark.png), not a recolour. */
  .masthead {
    background:
      radial-gradient(70rem 26rem at 50% -8rem, var(--navy-2) 0%, rgba(28,53,89,0) 70%),
      var(--navy);
    border-bottom: 1px solid rgba(184,148,63,.55);
    padding: 44px 20px 40px; text-align: center; color: #fff;
  }
  .masthead-inner { max-width: 82rem; margin: 0 auto; }
  .tnlogo { width: 236px; max-width: 66vw; height: auto; margin: 0 auto 22px; display: block; }
  h1 {
    font-family: 'Noto Serif', Georgia, 'Times New Roman', serif; font-weight: 600;
    font-size: clamp(2.1rem, 4.4vw, 2.9rem); letter-spacing: -.01em;
    margin: 0; text-wrap: balance; line-height: 1.02; color: #fff;
  }
  .tagline {
    margin: 10px 0 0; font-size: .95rem; color: var(--navy-ink);
    letter-spacing: .005em; text-wrap: balance;
  }
  .greet {
    margin: 4px 0 0; font-size: .76rem; color: rgba(207,217,232,.62);
    letter-spacing: .05em; text-transform: uppercase;
    font-family: 'Noto Sans', system-ui, sans-serif; font-weight: 600;
  }

  .searchbar { position: relative; max-width: 27rem; margin: 26px auto 0; }
  .searchbar > svg {
    position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: var(--muted); pointer-events: none;
  }
  #q {
    width: 100%; font: inherit; font-size: 16px;
    padding: 14px 14px 14px 43px;
    border: 1px solid rgba(255,255,255,.14); border-radius: 12px;
    background: var(--card); color: var(--ink);
    box-shadow: 0 2px 4px rgba(0,0,0,.16), 0 12px 30px rgba(0,0,0,.20);
  }
  #q:focus { outline: 2px solid var(--gold); outline-offset: 2px; border-color: transparent; }
  .hint { text-align: center; font-size: .74rem; color: rgba(207,217,232,.72); margin: 12px 0 0; }
  kbd {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .71rem;
    background: rgba(255,255,255,.10); color: #e7edf6;
    padding: 1px 5px; border-radius: 4px; border: 1px solid rgba(255,255,255,.18);
  }

  /* ── Category rule. Left, with the grid. Only the header, the search and the
        footer are centred (Matt, 2026-09-21). */
  section { margin-top: 40px; }
  section:first-child { margin-top: 44px; }
  section[hidden] { display: none; }
  .cat {
    display: flex; align-items: center; gap: 12px;
    font-family: 'Noto Sans', system-ui, sans-serif; font-size: .74rem; font-weight: 700;
    letter-spacing: .15em; text-transform: uppercase; color: var(--navy); margin: 0 0 18px;
  }
  .cat::before {
    content: ""; flex: none; width: 3px; height: 15px; border-radius: 2px;
    background: var(--gold);
  }
  .cat::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }
  .cat .n {
    font-size: .7rem; font-weight: 700; letter-spacing: .04em; color: var(--muted);
    background: var(--chip); border: 1px solid var(--hairline);
    border-radius: 20px; padding: 1px 8px;
  }

  /* ── Grid. Flex, not grid: a short last row CENTRES instead of leaving a void on
        the right, and tiles stretch to a cap so a full row fills the width.
        Six categories over twenty apps means no column count divides cleanly. */
  .grid {
    display: grid; gap: 16px; justify-content: start;
    grid-template-columns: repeat(var(--cols, 5), minmax(0, 340px));
  }
  @media (max-width: 1180px) {
    .grid { grid-template-columns: repeat(auto-fit, minmax(195px, 1fr)); }
  }
  .tile {
    display: flex; flex-direction: column; align-items: flex-start; text-align: left;
    gap: 10px; padding: 22px 16px 18px; min-height: 182px;
    background: var(--card); border: 1px solid var(--hairline); border-radius: 16px;
    box-shadow: var(--shadow); text-decoration: none; color: inherit;
    transition: transform .17s cubic-bezier(.2,.7,.3,1), box-shadow .17s cubic-bezier(.2,.7,.3,1),
                border-color .17s ease;
  }
  .tile:hover, .tile:focus-visible {
    transform: translateY(-3px); box-shadow: var(--lift);
    border-color: rgba(19,38,68,.28); outline: none;
  }
  .tile:hover .app { transform: scale(1.05); }
  .app { transition: transform .17s cubic-bezier(.2,.7,.3,1); }
  .tile:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  .tile[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .tile, .app { transition: none; }
    .tile:hover { transform: none; } .tile:hover .app { transform: none; }
  }

  /* ── ONE icon language. Every vendor mark floats at the same optical box, with no
        per-brand tinted plate. The plate is what made four different treatments read
        as four different design systems. Our own tools keep a neutral plate so that
        "ours" and "not yet live" stay legible as a deliberate second class. */
  .app {
    width: 62px; height: 62px; flex: none;
    display: grid; place-items: center;
  }
  .app > svg { width: 100%; height: 100%; display: block; transform: scale(var(--k, 1)); }
  .app > img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .app.ours {
    border-radius: 17px; background: var(--chip);
    box-shadow: inset 0 0 0 1px rgba(21,32,45,.05);
  }
  .app.ours > svg { width: 60%; height: 60%; }
  .app.ours > img { width: 74%; height: 74%; }

  .t-name {
    font-family: 'Noto Sans', system-ui, sans-serif; font-weight: 700; font-size: 1rem;
    letter-spacing: -.017em; margin: 0; line-height: 1.22;
  }
  .t-desc { font-size: .79rem; color: var(--muted); margin: 0; line-height: 1.36; }

  /* A tile with no confirmed URL is never a link. It reads as deliberate rather than
     broken: same shape, quieter surface, a plain "Coming soon" pill. The internal
     build note it used to wear ("where?", "awaiting host") had no business on a page
     that goes to the whole company. */
  .flag {
    font-family: 'Noto Sans', system-ui, sans-serif; font-size: .58rem; font-weight: 700;
    letter-spacing: .09em; text-transform: uppercase; color: var(--soon);
    background: var(--chip); border: 1px solid var(--hairline);
    padding: 2px 7px; border-radius: 20px; margin-top: auto;
  }
  .tile.pending {
    background: linear-gradient(180deg, #fbfcfe 0%, #f6f8fc 100%);
    box-shadow: none; border-color: #e4e9f1;
  }
  .tile.pending:hover { transform: none; box-shadow: none; border-color: #e4e9f1; }
  .tile.pending:hover .app { transform: none; }
  .tile.pending .t-name { color: #6c7b8d; }
  .tile.pending .app { opacity: .42; filter: grayscale(1); }

  /* Two doors on one tile. 44px minimum so the pair is still a real tap target on a
     phone, where this grid is two columns wide. */
  .acts { display: flex; gap: 7px; width: 100%; margin-top: auto; padding-top: 2px; }
  .acts a {
    flex: 1; display: grid; place-items: center; min-height: 44px; padding: 4px;
    font-family: 'Noto Sans', system-ui, sans-serif; font-size: .67rem; font-weight: 700;
    letter-spacing: .07em; text-transform: uppercase; text-decoration: none;
    color: var(--chip-ink); background: var(--chip);
    border: 1px solid var(--hairline); border-radius: 10px;
    transition: background .15s, color .15s, border-color .15s;
  }
  .acts a:hover, .acts a:focus-visible {
    background: var(--navy); color: #fff; border-color: var(--navy); outline: none;
  }
  .acts a:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  .tile.dual { cursor: default; }

  .empty { text-align: center; color: var(--muted); font-size: .9rem; padding: 44px 0; display: none; }
  .empty.show { display: block; }

  footer {
    margin-top: 60px; padding-top: 24px; border-top: 1px solid var(--hairline);
    text-align: center; font-size: .76rem; color: var(--muted);
  }
  footer p { margin: 0 0 6px; }
  footer .lead {
    font-family: 'Noto Sans', system-ui, sans-serif; font-weight: 700; font-size: .8rem;
    color: var(--navy); letter-spacing: -.005em;
  }
  footer a { color: var(--navy); text-decoration: underline; text-underline-offset: 2px; }

  @media (max-width: 720px) {
    .masthead { padding: 32px 16px 30px; }
    .tnlogo { width: 188px; margin-bottom: 16px; }
    .tagline { font-size: .86rem; }
    .greet { font-size: .68rem; }
    .wrap { padding: 0 16px 56px; }
    section { margin-top: 30px; } section:first-child { margin-top: 32px; }
    .cat { font-size: .66rem; margin-bottom: 13px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
    .tile { min-height: 156px; padding: 17px 11px 14px; gap: 8px; border-radius: 14px; }
    .app { width: 50px; height: 50px; }
    .app.ours { border-radius: 13px; }
    .t-name { font-size: .88rem; }
    .t-desc { font-size: .72rem; }
  }
</style>
</head>

//     url: null renders a dashed tile, never a broken link.

//     does not belong here. "Coming soon" is for something that WILL have a URL, like
//     Core BI waiting on a host. It is NOT for software that can only ever be opened
//     from the Windows desktop. DESTINI was removed under this rule: no web app, no
//     verified protocol, so a tile for it is decoration.

//     because it was never one: it was invented during the first build and given the
//     note "where?", which dressed a fabrication up as a real system with a missing

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ─── ONE icon language.
// Every vendor mark floats in the same 68px optical box with no per-brand plate.
// Mixing full-bleed logos, brand-tinted plates and grey glyphs read as four
// different design systems on one page. Our own tools and not-yet-live tiles
// keep a neutral plate, so that second class is deliberate rather than accidental.
function appIcon(a) {
  // A logo added through the editor rides on the inventory entry itself.
  if (a && a.icon) return `<span class="app"><img src="${esc(a.icon)}" alt="" loading="lazy"></span>`;
  const m = MARKS[(a && a.mark) || a] || MARKS.life;
  // A real logo file, embedded as a data URI by embed_logo.py.
  if (m.img)   return `<span class="app${m.ours ? ' ours' : ''}"><img src="${m.img}" alt="" loading="lazy"></span>`;
  // A real multi-colour brand SVG, carrying its own palette.
  if (m.raw)   return `<span class="app">${m.raw}</span>`;
  // Our own drawn glyphs: neutral plate, so "ours" and "pending" stay a readable class.
  if (m.glyph) return `<span class="app ours" style="color:${m.h};--k:${m.k || 1}">`
                    + `<svg viewBox="0 0 24 24" aria-hidden="true">${m.s}</svg></span>`;
  // A single-colour brand mark: the brand colour, floating, no plate.
  return `<span class="app" style="color:${m.h};--k:${m.k || 1}">`
       + `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${m.s}</svg></span>`;
}

const board = document.getElementById('board');

// ─── Render. Pure function of the inventory, so the same code paints the baked
// fallback and whatever apps.json turns out to hold.
function renderBoard(cats, apps) {
  board.innerHTML = cats.map(({ id, label }) => {
    // Live tiles first, "coming soon" at the end of their own section: a dead tile
    // sitting between two live ones reads as a gap in the row rather than a plan.
    const mine = apps.filter(a => a.cat === id)
                     .slice()
                     .sort((a, b) => (a.url ? 0 : 1) - (b.url ? 0 : 1));
    if (!mine.length) return '';
    const tiles = mine.map(a => {
      const pending = !a.url;
      const dual = !pending && !!a.desktop;
      // A dual tile is a div: an anchor cannot contain anchors, and the two doors are
      // the actions. data-href keeps it reachable from the Enter-opens-first-match path.
      const tag = (pending || dual) ? 'div' : 'a';
      const attrs = pending ? 'class="tile pending"'
        : dual ? `class="tile dual${a.note ? ' unconfirmed' : ''}" data-href="${esc(a.url)}"`
        : `class="tile${a.note ? ' unconfirmed' : ''}" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer"`;
      return `<${tag} ${attrs} data-k="${esc((a.name + ' ' + a.desc).toLowerCase())}">
          ${appIcon(a)}
          <span class="t-name">${esc(a.name)}</span>
          <span class="t-desc">${esc(a.desc)}</span>
          ${dual ? `<span class="acts">
               <a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">Online</a>
               <a href="#" data-proto="${esc(a.desktop)}" data-fallback="${esc(a.url)}">Desktop</a>
             </span>` : ''}
          ${a.note || pending ? `<span class="flag">${esc(a.note || 'Coming soon')}</span>` : ''}
        </${tag}>`;
    }).join('');
    return `<section data-cat="${esc(id)}"><h2 class="cat">${esc(label)}`
         + `<span class="n">${mine.length}</span></h2>`
         + `<div class="grid" style="--cols:${Math.min(5, mine.length)}">${tiles}</div></section>`;
  }).join('');
}

// Desktop door. A custom protocol that nothing is registered to handle fails
// SILENTLY: no error, no navigation, nothing. So fire it, then check whether the
// page ever lost focus. Focus lost means the app took over. Focus kept means it
// is not installed, and the right answer is the WEB version of the same app,
// which is the button immediately beside this one. Nobody needs a helpdesk
// ticket because Outlook did not open.
//
// Only documented URI schemes appear here (ms-excel:, ms-outlook:, msteams:,
// onedrive:). A guessed protocol fails for everyone and makes the fallback fire
// every single time, which is exactly how DESTINI ended up sending estimators
// to an IT portal.
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-proto]');
  if (!a) return;
  e.preventDefault();
  e.stopPropagation();
  let launched = false;
  const took = () => { launched = true; };
  window.addEventListener('blur', took, { once: true });
  document.addEventListener('visibilitychange', took, { once: true });
  window.location.href = a.dataset.proto;
  const fb = a.dataset.fallback;
  if (fb) setTimeout(() => {
    window.removeEventListener('blur', took);
    if (!launched && !document.hidden) window.open(fb, '_blank', 'noopener');
  }, 1600);
});

// Greeting. A startup screen that knows the day reads as alive rather than static,
// and it costs one Date call with no network and no integration.
(function () {
  const d = new Date(), h = d.getHours();
  const part = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  let when = '';
  try {
    when = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  } catch (e) { /* a locale the browser cannot format is not worth a broken header */ }
  document.getElementById('greet').textContent = when ? part + ' · ' + when : part;
})();

// ─── Search
const q = document.getElementById('q');
const empty = document.getElementById('empty');
let tiles = [], sections = [];

// Re-read after every paint. The node lists are live only in the DOM sense, not
// across an innerHTML replacement, and a stale list is a search box that filters
// tiles nobody can see.
function indexTiles() {
  tiles = [...board.querySelectorAll('.tile')];
  sections = [...board.querySelectorAll('section')];
}

function filter() {
  const term = q.value.trim().toLowerCase();
  let hits = 0;
  tiles.forEach(t => { const ok = !term || t.dataset.k.includes(term); t.hidden = !ok; if (ok) hits++; });
  sections.forEach(s => { s.hidden = ![...s.querySelectorAll('.tile')].some(t => !t.hidden); });
  empty.classList.toggle('show', hits === 0);
}
q.addEventListener('input', filter);
q.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const first = tiles.find(t => !t.hidden && (t.tagName === 'A' || t.dataset.href));
    const url = first && (first.tagName === 'A' ? first.href : first.dataset.href);
    if (url) window.open(url, '_blank', 'noopener');
  }
  if (e.key === 'Escape') { q.value = ''; filter(); q.blur(); }
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
});

// ─── Boot.
//
// THE FIRST PAINT NEVER WAITS ON THE NETWORK. The inventory baked into this file
// renders immediately, then apps.json replaces it if it is reachable and sane.
// That ordering is the whole point: this page is somebody's browser homepage, so
// a slow or missing apps.json must cost nothing, and opening the file straight
// off a share (where fetch has no origin) must still give a working launcher.
//
// It is also the guard against the 2026-09-21 trap, where a malformed inventory
// rendered a header and a footer with zero tiles and looked plausible until you
// counted them. A bad apps.json now loses to the baked copy instead of winning.
function paint(cats, apps) {
  renderBoard(cats, apps);
  indexTiles();
  filter();
}

const BAKED = {
  categories: BAKED_CATEGORIES.map(([id, label]) => ({ id, label })),
  apps: BAKED_APPS
};

paint(BAKED.categories, BAKED.apps);

fetch('apps.json', { cache: 'no-cache' })
  .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
  .then(d => {
    // Same shape check the editor and the CI guard apply. An inventory that would
    // paint an empty board is rejected here rather than shipped to the whole company.
    if (!d || !Array.isArray(d.categories) || !Array.isArray(d.apps)) throw new Error('shape');
    if (!d.categories.length || !d.apps.length) throw new Error('empty');
    const ids = new Set(d.categories.map(c => c && c.id));
    if (!d.apps.some(a => a && ids.has(a.cat))) throw new Error('no app lands in a category');
    paint(d.categories, d.apps);
  })
  .catch(() => { /* the baked inventory stands, and the page is already painted */ });
</script>
</body>
</html>
